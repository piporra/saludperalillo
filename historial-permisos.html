<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de permisos — CESFAM Peralillo</title>
<link rel="icon" type="image/jpeg" href="assets/logo-cesfam.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<style>
  :root{
    --teal-deep:#0A3D73; --teal:#1B7FC2; --teal-light:#E7F2FB; --sky:#F4FAFE;
    --gold:#12A6D6; --ink:#1C2B36; --gray:#5A6B78; --line:#DCE7F0; --radius:16px;
    --font-head:'Poppins', sans-serif; --font-body:'Atkinson Hyperlegible', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--font-body); color:var(--ink); background:var(--teal-light); line-height:1.6; font-size:16px;}
  h1{font-family:var(--font-head); color:var(--teal-deep); margin:0 0 6px;}
  p{margin:0 0 1em; color:var(--gray);}
  a{color:var(--teal-deep);}
  .container{max-width:900px; margin:0 auto; padding:0 24px;}

  header.site-header{background:#fff; border-bottom:1px solid var(--line);}
  .site-header .container{max-width:1180px; display:flex; align-items:center; justify-content:space-between; padding:16px 24px; flex-wrap:wrap; gap:10px;}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none;}
  .brand-logo{width:48px; height:48px; border-radius:50%; object-fit:cover; border:1.5px solid var(--line);}
  .brand-text .eyebrow{display:block; font-size:.7rem; letter-spacing:.07em; text-transform:uppercase; color:var(--teal); font-weight:700;}
  .brand-text .name{font-family:var(--font-head); font-weight:700; font-size:1.1rem; color:var(--teal-deep);}
  .header-right{display:flex; align-items:center; gap:16px; font-size:.85rem; color:var(--gray);}
  .header-right a{color:var(--teal-deep); text-decoration:none; font-weight:700;}
  .header-right a:hover{text-decoration:underline;}

  main{padding:40px 0 70px;}
  .page-head{text-align:center; margin-bottom:24px;}
  .page-head .eyebrow{color:var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:.07em; font-size:.8rem;}
  .page-head h1{font-size:1.6rem;}

  .toolbar{max-width:420px; margin:0 auto 24px;}
  .toolbar input{width:100%; padding:12px 16px; border:1.5px solid var(--line); border-radius:999px; font-family:var(--font-body); font-size:.95rem; background:#fff;}

  .persona-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); margin-bottom:16px; overflow:hidden; box-shadow:0 12px 30px rgba(10,61,115,.06);}
  .persona-header{width:100%; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px 20px; background:none; border:none; cursor:pointer; text-align:left;}
  .persona-header:hover{background:var(--teal-light);}
  .persona-header .nombre{font-family:var(--font-head); font-weight:700; color:var(--teal-deep); font-size:1rem;}
  .persona-header .rut{font-size:.8rem; color:var(--gray);}
  .persona-header .right{display:flex; align-items:center; gap:14px;}
  .conteo{display:flex; flex-direction:column; align-items:flex-end; min-width:130px;}
  .conteo .bar-track{width:110px; height:8px; background:var(--teal-light); border-radius:999px; overflow:hidden; margin-bottom:4px;}
  .conteo .bar-fill{height:100%; background:linear-gradient(90deg, #12A6D6, #1B7FC2);}
  .conteo .num{font-size:.8rem; font-weight:700; color:var(--teal-deep);}
  .conteo .num.lleno{color:#B33A3A;}
  .chevron{transition:transform .2s; color:var(--gold); flex-shrink:0;}
  .persona-card.open .chevron{transform:rotate(180deg);}

  .persona-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .persona-body-inner{padding:0 20px 18px;}
  .item-hist{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); flex-wrap:wrap;}
  .item-hist .info h4{margin:0; font-size:.9rem; color:var(--ink); font-weight:700;}
  .item-hist .info p{margin:2px 0 0; font-size:.8rem; color:var(--gray);}
  .badge{font-size:.72rem; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;}
  .badge-pendiente{background:#FFF2CC; color:#7A5B0E;}
  .badge-aprobado{background:#DFF2E4; color:#1E6B3C;}
  .badge-rechazado{background:#FBE3E3; color:#A32D2D;}

  #estado{text-align:center; color:var(--gray); padding:30px; font-size:.95rem;}
  #estado.error{color:#B33A3A;}
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="assets/logo-cesfam.jpeg" alt="Logo CESFAM Peralillo">
      <span class="brand-text">
        <span class="eyebrow">Servicio de Salud O'Higgins</span>
        <span class="name">CESFAM Peralillo</span>
      </span>
    </a>
    <div class="header-right">
      <span>👤 <span id="auth-user-name"></span></span>
      <a href="dashboard.html">← Volver al portal</a>
      <a href="#" onclick="cerrarSesion(); return false;">Cerrar sesión</a>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-head">
      <span class="eyebrow">Área funcionarios</span>
      <h1>Historial de permisos administrativos</h1>
      <p>Días administrativos usados por cada funcionario este año (se cuentan solo los permisos ya <strong>aprobados</strong>: día completo = 1, medio día = 0,5).</p>
    </div>

    <div class="toolbar">
      <input type="text" id="buscador" placeholder="🔎 Buscar funcionario...">
    </div>

    <div id="listaPersonas">
      <p id="estado">Cargando historial...</p>
    </div>
  </div>
</main>

<script src="assets/auth-guard.js"></script>
<script>
  const DIAS_TOTALES = 6;
  let personasData = [];

  function badgeEstado(sol) {
    if (sol.estado === 'aprobado') return '<span class="badge badge-aprobado">✅ Aprobado</span>';
    if (sol.estado === 'rechazado') return '<span class="badge badge-rechazado">❌ Rechazado</span>';
    if (sol.estado === 'pendiente_personal') return '<span class="badge badge-pendiente">⏳ Con Jefe de Personal</span>';
    if (sol.estado === 'pendiente_director') return '<span class="badge badge-pendiente">⏳ Con director</span>';
    return '<span class="badge badge-pendiente">⏳ Con jefe directo</span>';
  }

  function diasDe(sol) {
    return sol.tipo === 'Medio día' ? 0.5 : 1;
  }

  function fmtDias(n) {
    const entero = Math.floor(n);
    const tieneMedio = (n - entero) >= 0.5 - 1e-9 && (n - entero) < 1;
    if (tieneMedio) return (entero > 0 ? entero + ' ' : '') + '½';
    return String(entero);
  }

  function fmtFecha(iso) {
    return new Date(iso + 'T00:00:00').toLocaleDateString('es-CL');
  }

  function renderLista(filtro) {
    const cont = document.getElementById('listaPersonas');
    cont.innerHTML = '';
    const f = (filtro || '').trim().toLowerCase();

    const filtradas = personasData.filter(p => !f || p.nombre.toLowerCase().includes(f));

    if (filtradas.length === 0) {
      cont.innerHTML = '<p id="estado">No se encontraron funcionarios con ese nombre.</p>';
      return;
    }

    filtradas.forEach(p => {
      const usados = p.historial
        .filter(s => s.estado === 'aprobado')
        .reduce((sum, s) => sum + diasDe(s), 0);
      const porcentaje = Math.min(100, (usados / DIAS_TOTALES) * 100);

      const card = document.createElement('div');
      card.className = 'persona-card';

      const header = document.createElement('button');
      header.type = 'button';
      header.className = 'persona-header';
      header.innerHTML =
        '<div><div class="nombre">' + p.nombre + '</div><div class="rut">RUT ' + p.rut + ' · ' + p.historial.length + ' solicitud(es)</div></div>' +
        '<div class="right">' +
          '<div class="conteo">' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + porcentaje + '%;"></div></div>' +
            '<span class="num' + (usados >= DIAS_TOTALES ? ' lleno' : '') + '">' + fmtDias(usados) + ' de ' + DIAS_TOTALES + ' usados</span>' +
          '</div>' +
          '<svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>' +
        '</div>';

      const body = document.createElement('div');
      body.className = 'persona-body';
      const bodyInner = document.createElement('div');
      bodyInner.className = 'persona-body-inner';

      p.historial.forEach(sol => {
        const item = document.createElement('div');
        item.className = 'item-hist';
        item.innerHTML =
          '<div class="info"><h4>' + fmtFecha(sol.fecha_permiso) + ' — ' + sol.tipo + (sol.turno ? ' (' + sol.turno + ')' : '') + '</h4>' +
          '<p>' + (sol.motivo || 'Sin motivo especificado') + '</p></div>' +
          badgeEstado(sol);
        bodyInner.appendChild(item);
      });

      body.appendChild(bodyInner);
      card.appendChild(header);
      card.appendChild(body);
      cont.appendChild(card);

      header.addEventListener('click', () => {
        const abierta = card.classList.toggle('open');
        body.style.maxHeight = abierta ? body.scrollHeight + 'px' : null;
      });
    });
  }

  async function cargarHistorial() {
    const cont = document.getElementById('listaPersonas');
    try {
      const supabase = getSupabaseClient();
      const { data: { session } } = await supabase.auth.getSession();
      const res = await fetch('/api/historial-permisos', {
        headers: { 'Authorization': 'Bearer ' + session.access_token }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      // Agrupar por RUT del solicitante
      const grupos = {};
      (data.solicitudes || []).forEach(sol => {
        if (!grupos[sol.rut_solicitante]) {
          grupos[sol.rut_solicitante] = { rut: sol.rut_solicitante, nombre: sol.nombre_solicitante, historial: [] };
        }
        grupos[sol.rut_solicitante].historial.push(sol);
      });
      personasData = Object.values(grupos).sort((a, b) => a.nombre.localeCompare(b.nombre));

      if (personasData.length === 0) {
        cont.innerHTML = '<p id="estado">Todavía no hay ninguna solicitud registrada.</p>';
        return;
      }

      renderLista('');
    } catch (err) {
      console.error(err);
      cont.innerHTML = '<p id="estado" class="error">' + (err.message === 'No tienes permiso para ver el historial completo'
        ? 'Esta vista es solo para Jefe de Personal o Director.'
        : 'No se pudo cargar el historial en este momento.') + '</p>';
    }
  }

  document.getElementById('buscador').addEventListener('input', (e) => renderLista(e.target.value));

  window.addEventListener('DOMContentLoaded', cargarHistorial);
</script>

</body>
</html>
