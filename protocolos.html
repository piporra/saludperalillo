<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocolos — CESFAM Peralillo</title>
<link rel="icon" type="image/jpeg" href="assets/logo-cesfam.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<style>
  :root{
    --teal-deep:#0A3D73; --teal:#1B7FC2; --teal-light:#E7F2FB; --sky:#F4FAFE;
    --gold:#12A6D6; --ink:#1C2B36; --gray:#5A6B78; --line:#DCE7F0; --radius:16px;
    --font-head:'Poppins', sans-serif; --font-body:'Atkinson Hyperlegible', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--font-body); color:var(--ink); background:var(--teal-light); line-height:1.6; font-size:16px;}
  h1{font-family:var(--font-head); color:var(--teal-deep); margin:0 0 6px;}
  p{margin:0 0 1em; color:var(--gray);}
  a{color:var(--teal-deep);}
  .container{max-width:800px; margin:0 auto; padding:0 24px;}

  header.site-header{background:#fff; border-bottom:1px solid var(--line);}
  .site-header .container{max-width:1180px; display:flex; align-items:center; justify-content:space-between; padding:16px 24px; flex-wrap:wrap; gap:10px;}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none;}
  .brand-logo{width:48px; height:48px; border-radius:50%; object-fit:cover; border:1.5px solid var(--line);}
  .brand-text .eyebrow{display:block; font-size:.7rem; letter-spacing:.07em; text-transform:uppercase; color:var(--teal); font-weight:700;}
  .brand-text .name{font-family:var(--font-head); font-weight:700; font-size:1.1rem; color:var(--teal-deep);}
  .header-right{display:flex; align-items:center; gap:16px; font-size:.85rem; color:var(--gray);}
  .header-right a{color:var(--teal-deep); text-decoration:none; font-weight:700;}
  .header-right a:hover{text-decoration:underline;}

  main{padding:40px 0 70px;}
  .page-head{text-align:center; margin-bottom:28px;}
  .page-head .eyebrow{color:var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:.07em; font-size:.8rem;}
  .page-head h1{font-size:1.7rem;}

  .toolbar{max-width:420px; margin:0 auto 24px;}
  .toolbar input{
    width:100%; padding:12px 16px; border:1.5px solid var(--line); border-radius:999px;
    font-family:var(--font-body); font-size:.95rem; background:#fff;
  }

  .proto-list{display:flex; flex-direction:column; gap:14px;}

  .proto-category{background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:0 8px 20px rgba(10,61,115,.05);}
  .proto-cat-header{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 20px; background:none; border:none; cursor:pointer; text-align:left;
    font-family:var(--font-head); font-weight:700; color:var(--teal-deep); font-size:1rem;
  }
  .proto-cat-header:hover{background:var(--teal-light);}
  .proto-cat-header .count{font-size:.78rem; font-weight:600; color:var(--gray); background:var(--teal-light); padding:3px 10px; border-radius:999px; margin-left:8px;}
  .proto-cat-header .chevron{transition:transform .2s; color:var(--gold); flex-shrink:0; margin-left:auto;}
  .proto-category.open .chevron{transform:rotate(180deg);}
  .proto-cat-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .proto-cat-body-inner{padding:0 16px 16px;}

  .proto-subcat{border-top:1px solid var(--line); padding-top:6px; margin-top:6px;}
  .proto-subcat:first-child{border-top:none; margin-top:0; padding-top:0;}
  .proto-subcat-header{
    width:100%; display:flex; align-items:center; gap:10px; padding:10px 8px;
    background:none; border:none; cursor:pointer; text-align:left;
    font-family:var(--font-body); font-weight:700; color:var(--ink); font-size:.9rem;
  }
  .proto-subcat-header:hover{color:var(--teal-deep);}
  .proto-subcat-header .count{font-size:.72rem; font-weight:600; color:var(--gray); background:var(--sky); padding:2px 8px; border-radius:999px;}
  .proto-subcat-header .chevron{transition:transform .2s; color:var(--gold); flex-shrink:0; margin-left:auto; width:14px; height:14px;}
  .proto-subcat.open .chevron{transform:rotate(180deg);}
  .proto-subcat-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .proto-subcat-body-inner{padding:0 0 6px 20px;}

  .proto-item{
    display:flex; align-items:center; gap:14px; padding:12px 12px; border-radius:10px;
    text-decoration:none; color:var(--ink); transition:background .15s;
  }
  .proto-item:hover{background:var(--teal-light);}
  .proto-item .icon{
    width:40px; height:40px; border-radius:10px; background:var(--teal-light); color:var(--teal-deep);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .proto-item .info{flex:1; min-width:0;}
  .proto-item h3{font-family:var(--font-head); color:var(--teal-deep); font-size:.95rem; margin:0; font-weight:600;}
  .proto-item .go{font-size:.8rem; font-weight:700; color:var(--gold); white-space:nowrap;}

  #protoStatus{text-align:center; color:var(--gray); padding:30px; font-size:.95rem;}
  #protoStatus.error{color:#B33A3A;}
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="assets/logo-cesfam.jpeg" alt="Logo CESFAM Peralillo">
      <span class="brand-text">
        <span class="eyebrow">Servicio de Salud O'Higgins</span>
        <span class="name">CESFAM Peralillo</span>
      </span>
    </a>
    <div class="header-right">
      <span>👤 <span id="auth-user-name"></span></span>
      <a href="dashboard.html">← Volver al portal</a>
      <a href="#" onclick="cerrarSesion(); return false;">Cerrar sesión</a>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-head">
      <span class="eyebrow">Portal de funcionarios</span>
      <h1>Protocolos</h1>
      <p>Protocolos vigentes que debe conocer y tener disponible cada funcionario.</p>
    </div>

    <div class="toolbar">
      <input type="text" id="protoSearch" placeholder="🔎 Buscar protocolo...">
    </div>

    <div id="protoList" class="proto-list" style="display:none;"></div>
    <p id="protoStatus">Cargando protocolos...</p>
  </div>
</main>

<script src="assets/auth-guard.js"></script>
<script>
  // ===== Lista de protocolos (leída EN VIVO desde la estructura de carpetas de GitHub) =====
  // No hay que mantener ninguna lista a mano: el sitio recorre automáticamente
  // las carpetas y subcarpetas dentro de assets/protocolos/ en tu repositorio.
  // Para agregar un protocolo nuevo: solo sube el PDF a la carpeta que
  // corresponda (o crea una subcarpeta nueva) — aparece solo, sin tocar código.
  const GITHUB_OWNER = "piporra";
  const GITHUB_REPO = "saludperalillo";
  const GITHUB_BRANCH = "main";
  const ROOT_PATH = "assets/protocolos";

  // Nombres bonitos para las carpetas de categoría (coincide con el nombre
  // de carpeta en minúsculas-con-guiones). Si creas una categoría nueva que
  // no está aquí, se muestra igual, solo que con el nombre de carpeta tal cual.
  const NOMBRES_CATEGORIA = {
    "ambito-acceso-oportunidad-y-continuidad": "Ámbito Acceso Oportunidad y Continuidad",
    "ambito-competencias-recurso-humano": "Ámbito Competencias Recurso Humano",
    "ambito-dignidad-paciente": "Ámbito Dignidad Paciente",
    "ambito-gestion-clinica": "Ámbito Gestión Clínica",
    "ambito-gestion-de-la-calidad": "Ámbito Gestión de la Calidad",
    "ambito-registros": "Ámbito Registros",
    "ambito-seguridad-de-las-instalaciones": "Ámbito Seguridad de las Instalaciones",
    "ambito-seguridad-del-equipamiento": "Ámbito Seguridad del Equipamiento",
    "apoyo": "Apoyo",
    "indicadores-por-unidades": "Indicadores por Unidades",
    "plan-institucional-de-emergencia": "Plan Institucional de Emergencia",
    "protocolo-trato-usuario-institucional": "Protocolo Trato Usuario Institucional"
  };

  let todosLosProtocolos = []; // { categoria, subcarpeta, nombre, archivo }

  function iconoProtocolo() {
    return '<div class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6M9 9h1"/></svg></div>';
  }

  async function listarCarpetaGitHub(path) {
    const url = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO +
      '/contents/' + path.split('/').map(encodeURIComponent).join('/') + '?ref=' + GITHUB_BRANCH;
    const res = await fetch(url);
    if (!res.ok) {
      if (res.status === 403) throw new Error('LIMITE_API');
      throw new Error('No se pudo listar ' + path);
    }
    return res.json();
  }

  // Recorre una carpeta de forma recursiva. "etiquetaSubcarpeta" va
  // acumulando el nombre de las subcarpetas por las que va bajando
  // (ej: "RH 1.2 CAT B-C / ENFERMERAS TITULARES").
  async function recorrerCarpeta(path, etiquetaSubcarpeta) {
    const items = await listarCarpetaGitHub(path);
    let resultado = [];
    for (const item of items) {
      if (item.type === 'file' && /\.pdf$/i.test(item.name)) {
        resultado.push({
          subcarpeta: etiquetaSubcarpeta,
          nombre: item.name.replace(/\.pdf$/i, ''),
          archivo: item.path
        });
      } else if (item.type === 'dir') {
        const nuevaEtiqueta = etiquetaSubcarpeta ? etiquetaSubcarpeta + ' / ' + item.name : item.name;
        const sub = await recorrerCarpeta(item.path, nuevaEtiqueta);
        resultado = resultado.concat(sub);
      }
    }
    return resultado;
  }

  function renderLista(filtro) {
    const list = document.getElementById('protoList');
    list.innerHTML = '';
    const filtroLower = (filtro || '').trim().toLowerCase();
    const hayFiltro = filtroLower !== '';

    // Agrupar por categoría → subcarpeta (subcarpeta puede venir vacía)
    const categorias = {};
    todosLosProtocolos.forEach(p => {
      if (hayFiltro && !p.nombre.toLowerCase().includes(filtroLower)) return;
      const sub = (p.subcarpeta || '').trim();
      if (!categorias[p.categoria]) categorias[p.categoria] = {};
      if (!categorias[p.categoria][sub]) categorias[p.categoria][sub] = [];
      categorias[p.categoria][sub].push(p);
    });

    const nombresCategorias = Object.keys(categorias);

    if (nombresCategorias.length === 0) {
      list.innerHTML = '<p style="text-align:center; color:var(--gray);">No se encontraron protocolos con ese nombre.</p>';
      return;
    }

    function crearItemPDF(p) {
      const a = document.createElement('a');
      a.className = 'proto-item';
      a.href = encodeURI(p.archivo);
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = iconoProtocolo() + '<div class="info"><h3>' + p.nombre + '</h3></div><span class="go">Ver / Descargar →</span>';
      return a;
    }

    nombresCategorias.forEach(cat => {
      const subgrupos = categorias[cat];
      const totalItems = Object.values(subgrupos).reduce((n, arr) => n + arr.length, 0);

      const wrap = document.createElement('div');
      wrap.className = 'proto-category' + (hayFiltro ? ' open' : '');

      const header = document.createElement('button');
      header.type = 'button';
      header.className = 'proto-cat-header';
      header.innerHTML =
        '<span>📁 ' + cat + '</span>' +
        '<span class="count">' + totalItems + '</span>' +
        '<svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

      const body = document.createElement('div');
      body.className = 'proto-cat-body';
      const bodyInner = document.createElement('div');
      bodyInner.className = 'proto-cat-body-inner';

      // PDF sueltos, directo en la categoría (sin subcarpeta)
      (subgrupos[''] || []).forEach(p => bodyInner.appendChild(crearItemPDF(p)));

      // Subcarpetas, como segundo nivel desplegable
      Object.keys(subgrupos).filter(s => s !== '').forEach(sub => {
        const items = subgrupos[sub];
        const subWrap = document.createElement('div');
        subWrap.className = 'proto-subcat' + (hayFiltro ? ' open' : '');

        const subHeader = document.createElement('button');
        subHeader.type = 'button';
        subHeader.className = 'proto-subcat-header';
        subHeader.innerHTML =
          '<span>📂 ' + sub + '</span>' +
          '<span class="count">' + items.length + '</span>' +
          '<svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

        const subBody = document.createElement('div');
        subBody.className = 'proto-subcat-body';
        const subBodyInner = document.createElement('div');
        subBodyInner.className = 'proto-subcat-body-inner';
        items.forEach(p => subBodyInner.appendChild(crearItemPDF(p)));
        subBody.appendChild(subBodyInner);

        subWrap.appendChild(subHeader);
        subWrap.appendChild(subBody);
        bodyInner.appendChild(subWrap);

        subHeader.addEventListener('click', (e) => {
          e.stopPropagation();
          const abierta = subWrap.classList.toggle('open');
          subBody.style.maxHeight = abierta ? subBody.scrollHeight + 'px' : null;
          if (wrap.classList.contains('open')) body.style.maxHeight = body.scrollHeight + 'px';
        });

        if (hayFiltro) subBody.style.maxHeight = subBody.scrollHeight + 'px';
      });

      body.appendChild(bodyInner);
      wrap.appendChild(header);
      wrap.appendChild(body);
      list.appendChild(wrap);

      header.addEventListener('click', () => {
        const abierta = wrap.classList.toggle('open');
        body.style.maxHeight = abierta ? body.scrollHeight + 'px' : null;
      });

      if (hayFiltro) {
        body.style.maxHeight = body.scrollHeight + 'px';
      }
    });
  }

  async function cargarProtocolos() {
    const status = document.getElementById('protoStatus');
    const list = document.getElementById('protoList');

    // Guarda en caché por 10 minutos para no golpear la API de GitHub
    // cada vez que alguien entra a la página.
    const CACHE_KEY = 'protocolos-cache-v1';
    const CACHE_MS = 10 * 60 * 1000;
    try {
      const cache = JSON.parse(sessionStorage.getItem(CACHE_KEY) || 'null');
      if (cache && (Date.now() - cache.t) < CACHE_MS) {
        todosLosProtocolos = cache.data;
        renderLista('');
        status.style.display = 'none';
        list.style.display = 'flex';
        return;
      }
    } catch (e) { /* ignora errores de caché */ }

    try {
      const categoriasDirs = await listarCarpetaGitHub(ROOT_PATH);
      let todos = [];

      for (const catDir of categoriasDirs) {
        if (catDir.type !== 'dir') continue;
        const nombreBonito = NOMBRES_CATEGORIA[catDir.name] || catDir.name;
        const archivos = await recorrerCarpeta(catDir.path, '');
        archivos.forEach(a => a.categoria = nombreBonito);
        todos = todos.concat(archivos);
      }

      todosLosProtocolos = todos;

      try {
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data: todos }));
      } catch (e) { /* si sessionStorage falla, no pasa nada grave */ }

      if (todosLosProtocolos.length === 0) {
        status.textContent = 'Aún no hay protocolos cargados.';
        return;
      }

      renderLista('');
      status.style.display = 'none';
      list.style.display = 'flex';
    } catch (err) {
      console.error('No se pudo cargar la lista de protocolos:', err);
      status.classList.add('error');
      if (err.message === 'LIMITE_API') {
        status.textContent = 'Se alcanzó el límite temporal de consultas. Inténtalo de nuevo en unos minutos.';
      } else {
        status.textContent = 'No se pudo cargar la lista en este momento.';
      }
    }
  }

  document.getElementById('protoSearch').addEventListener('input', (e) => renderLista(e.target.value));

  window.addEventListener('DOMContentLoaded', cargarProtocolos);
</script>

</body>
</html>
