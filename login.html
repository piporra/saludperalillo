<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso funcionarios — CESFAM Peralillo</title>
<link rel="icon" type="image/jpeg" href="assets/logo-cesfam.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<style>
  :root{
    --teal-deep:#0A3D73; --teal:#1B7FC2; --teal-light:#E7F2FB; --sky:#F4FAFE;
    --gold:#12A6D6; --ink:#1C2B36; --gray:#5A6B78; --line:#DCE7F0; --radius:16px;
    --font-head:'Poppins', sans-serif; --font-body:'Atkinson Hyperlegible', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--teal-light); font-family:var(--font-body); color:var(--ink);}
  .login-card{background:#fff; border-radius:var(--radius); box-shadow:0 20px 50px rgba(10,61,115,.12); padding:36px; width:100%; max-width:400px; margin:24px;}
  .login-card img{width:64px; height:64px; border-radius:50%; display:block; margin:0 auto 14px; border:1.5px solid var(--line);}
  h1{font-family:var(--font-head); font-size:1.3rem; color:var(--teal-deep); text-align:center; margin:0 0 4px;}
  p.sub{text-align:center; color:var(--gray); font-size:.9rem; margin:0 0 22px;}
  label{display:block; font-weight:700; font-size:.9rem; margin-bottom:6px; color:var(--teal-deep);}
  input{width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; margin-bottom:16px; font-family:var(--font-body); font-size:.95rem;}
  button{width:100%; background:var(--gold); color:#fff; border:none; padding:14px; border-radius:999px; font-weight:700; font-size:1rem; cursor:pointer; font-family:var(--font-body);}
  button:hover{background:#0E86AC;}
  button:disabled{opacity:.6; cursor:not-allowed;}
  #status{text-align:center; font-size:.88rem; margin-top:14px; min-height:20px;}
  .back{display:block; text-align:center; margin-top:18px; font-size:.85rem; color:var(--teal-deep); text-decoration:none;}
  .back:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="login-card">
  <img src="assets/logo-cesfam.jpeg" alt="Logo CESFAM Peralillo">
  <h1>Acceso funcionarios</h1>
  <p class="sub">CESFAM Peralillo</p>

  <form id="loginForm">
    <label for="username">Nombre de usuario</label>
    <input type="text" id="username" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Ingresar</button>
    <p id="status"></p>
  </form>

  <a class="back" href="index.html">← Volver al sitio</a>
</div>

<script>
  const form = document.getElementById('loginForm');
  const status = document.getElementById('status');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (SUPABASE_URL.includes('PEGA_AQUI')) {
      status.style.color = '#B33A3A';
      status.textContent = 'El acceso de funcionarios aún no está configurado (revisa el README).';
      return;
    }

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const email = usernameToEmail(username);

    btn.disabled = true;
    status.style.color = 'var(--gray)';
    status.textContent = 'Verificando...';

    try {
      const supabase = getSupabaseClient();
      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        status.style.color = '#B33A3A';
        status.textContent = 'Usuario o contraseña incorrectos.';
        btn.disabled = false;
        return;
      }

      status.style.color = 'var(--teal)';
      status.textContent = '✅ Acceso concedido, redirigiendo...';

      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect') || 'dashboard.html';
      window.location.href = redirect;
    } catch (err) {
      status.style.color = '#B33A3A';
      status.textContent = 'Ocurrió un error. Inténtalo nuevamente.';
      btn.disabled = false;
      console.error(err);
    }
  });
</script>

</body>
</html>
